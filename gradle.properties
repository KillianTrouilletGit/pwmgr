## JVM args for Gradle daemon. Compose Multiplatform + AGP need more than the default 512m.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

## We use a custom jvmAndAndroidMain intermediate source set in :shared:crypto and :shared:ui.
## The Kotlin default hierarchy template doesn't define this group, so we manage source-set
## edges manually and disable the template to silence the related warning.
kotlin.mpp.applyDefaultHierarchyTemplate=false

## Required to silence AGP-versus-non-final-Kotlin warning when KMP is in the mix.
kotlin.mpp.androidSourceSetLayoutVersion=2

## AndroidX is the only supported support-library family on modern AGP.
android.useAndroidX=true

## Kotlin/Native isn't used here; skip the auto-provision overhead.
kotlin.native.ignoreDisabledTargets=true
