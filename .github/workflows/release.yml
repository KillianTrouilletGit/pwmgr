name: Release

on:
  push:
    tags: ['v*']

# Manual trigger from the Actions tab is useful while shaking out the workflow.
permissions:
  contents: write

jobs:
  windows-msi:
    name: Windows MSI + native messaging host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
      - name: Build MSI
        run: .\gradlew.bat --no-daemon :desktopApp:packageReleaseMsi
      - name: Build native messaging host
        run: .\gradlew.bat --no-daemon :nativeHost:installDist
      - name: Zip native host distribution
        run: |
          Compress-Archive `
            -Path nativeHost\build\install\pwmgr-native-host\* `
            -DestinationPath pwmgr-native-host-windows.zip
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi
      - name: Upload native host
        uses: actions/upload-artifact@v4
        with:
          name: native-host
          path: pwmgr-native-host-windows.zip

  android-apk:
    name: Android APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ubuntu-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build release APK
        # Release is signed only if PWMGR_KEYSTORE* env vars are set (see docs/RELEASE.md).
        # Without them the APK is unsigned — users can sideload with `adb install -r` only
        # after uninstalling any previously-debug-signed copy.
        run: ./gradlew --no-daemon :androidApp:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: androidApp/build/outputs/apk/release/*.apk

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install + build extension
        working-directory: browser-extension
        run: |
          npm ci
          npm run build
      - name: Zip extension dist
        working-directory: browser-extension
        run: zip -r ../pwmgr-extension.zip dist
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: pwmgr-extension.zip

  publish:
    name: Publish GitHub Release
    needs: [windows-msi, android-apk, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten into a single dir
        run: |
          mkdir release
          find artifacts -type f \( -name '*.msi' -o -name '*.apk' -o -name '*.zip' \) -exec cp {} release/ \;
      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            Verify your download — `Get-FileHash <file> -Algorithm SHA256` on Windows or
            `sha256sum <file>` on Linux/macOS — against `SHA256SUMS.txt`.

            - `PwMgr-*.msi` — Windows desktop installer (unsigned, SmartScreen will warn — see [docs/RELEASE.md](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE.md))
            - `androidApp-release.apk` — Android APK (sideload via `adb install`)
            - `pwmgr-extension.zip` — Chromium/Edge browser extension (load unpacked)
            - `pwmgr-native-host-windows.zip` — bridge between the browser extension and the desktop app

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for setup steps.
